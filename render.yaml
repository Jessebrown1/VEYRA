databases:
  - name: veyra-db
    plan: free
    region: oregon

services:
  # FastAPI AI service — Gemini's free tier stands in for local Ollama here,
  # since Render's free/starter plans don't have the RAM to run a local model.
  - name: veyra-ai-service
    type: web
    runtime: python
    plan: free
    region: oregon
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MODEL_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_CHAT_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_EMBED_MODEL
        value: gemini-embedding-2
      - key: GEMINI_EMBED_DIMENSIONS
        value: "768"

  # NestJS backend — runs the pgvector-enabling migration and catalog seed
  # before every deploy (both are idempotent, safe to repeat).
  - name: veyra-backend
    type: web
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy && npx prisma db seed
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: veyra-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: AI_SERVICE_URL
        value: https://veyra-ai-service.onrender.com
